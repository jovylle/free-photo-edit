# Tooling config only — this project is not an installable package (it runs from
# the repo root via uvicorn, see README.md). Guardrail settings are owned by
# CODEOWNERS: changing them needs a `config-change` PR label.

[tool.mypy]
python_version = "3.12"
strict = true
files = ["api"]
show_error_codes = true
pretty = false
# Tests are checked too: they are the contract cheap agents must not weaken.
[[tool.mypy.overrides]]
module = "dotenv"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
# Deliberately narrow: rules that catch real bugs without fighting FastAPI's
# Depends()/File() defaults. Widening is a separate, reviewable change.
lint.select = ["E4", "E7", "E9", "F", "I"]
