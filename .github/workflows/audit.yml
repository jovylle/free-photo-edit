name: audit

# Weekly drift check: writes .ai/metrics.json and fails if any metric got worse
# than .ai/baseline.json. Read-only; it never edits code.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - id: audit
        continue-on-error: true
        run: scripts/audit.sh
      - if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'ai-durability';
            const body = `Weekly audit failed: a metric is worse than .ai/baseline.json.\n\nRun \`scripts/audit.sh\` locally and compare with \`.ai/metrics.json\`.\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, labels: label, state: 'open',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title: 'AI durability: drift detected', body, labels: [label],
              });
            }
      - if: steps.audit.outcome == 'failure'
        run: exit 1
