# Private dev stack on elitedesk. Fake provider: no key, no spend.
name: free-photo-edit-dev
expose: tunnel
source: { path: /home/me/.homeploy/projects/free-photo-edit-dev/src }
ports: ["8090:8080"]
hostnames: ["free-photo-edit-dev.uft1.com"]
# Dev ledger/storage live outside src/ so a redeploy cannot wipe them.
volumes: ["/home/me/.homeploy/projects/free-photo-edit-dev/data:/app/data"]
healthcheck: { path: /api/config, timeout: 180 }
